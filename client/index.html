  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ethics Critic — AI-powered ethical reasoning platform. Analyze decisions, policies, and dilemmas across seven philosophical frameworks: Utilitarianism, Deontology, Virtue Ethics, Care Ethics, Rights-Based Ethics, Justice, and Contractualism." />

    <!-- Favicon -->

    <!-- Initial dark mode flicker prevention -->
    <script>
      try {
        const dark = localStorage.getItem('ec_dark_v1');
        if (dark === null || dark === 'true') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch(e) {
        document.documentElement.classList.add('dark');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
